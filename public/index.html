<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#14532d" />
  <!-- The UI is light-only; stop dark-mode browsers auto-darkening form controls. -->
  <meta name="color-scheme" content="light" />
  <title>Third Shot — Find courts, friends & games</title>
  <link rel="stylesheet" href="/styles-v15.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-512.png" type="image/png" />
  <link rel="apple-touch-icon" href="icon-512.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Third Shot" />
</head>
<body>
  <!-- Inline pickleball glyph (there is no pickleball emoji) — referenced via <use href="#pb">. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="pb" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="45" fill="#d5e64f" stroke="#9aad3f" stroke-width="3"/>
      <g fill="#33420f">
        <circle cx="50" cy="25" r="6.8"/><circle cx="73" cy="38" r="6.8"/><circle cx="73" cy="62" r="6.8"/>
        <circle cx="50" cy="75" r="6.8"/><circle cx="27" cy="62" r="6.8"/><circle cx="27" cy="38" r="6.8"/>
        <circle cx="50" cy="50" r="6.8"/>
      </g>
    </symbol>
  </svg>
  <div id="app">
    <section id="boot-screen" class="screen boot-screen" aria-label="Opening Third Shot">
      <img src="logo.jpg" alt="" class="boot-logo" />
      <div class="boot-progress" aria-hidden="true"><span></span></div>
      <p>Getting your next game ready…</p>
    </section>
    <div id="offline-banner" class="offline-banner hidden" role="status" aria-live="polite">
      <span>📡 You're offline — saved details stay available</span>
      <button type="button" id="connection-retry">Retry</button>
    </div>
    <!-- Auth screen -->
    <section id="auth-screen" class="screen hidden">
      <div class="auth-card">
        <img src="logo.jpg" alt="Third Shot" class="auth-logo-img" />
        <p class="auth-tagline">Find courts. Meet players. Get on the court.</p>
        <form id="auth-form">
          <label class="sr-only" for="auth-name">Display name</label>
          <input type="text" id="auth-name" placeholder="Display name" autocomplete="name" class="hidden" />
          <label class="sr-only" for="auth-email">Email</label>
          <input type="email" id="auth-email" placeholder="Email" autocomplete="email" required />
          <label class="sr-only" for="auth-password">Password</label>
          <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" required minlength="6" />
          <p id="auth-error" class="form-error hidden" role="alert" aria-live="assertive" tabindex="-1"></p>
          <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Log in</button>
        </form>
        <button class="btn-link" id="auth-toggle">New here? Create an account</button>
      </div>
    </section>

    <!-- Main app -->
    <main id="main-screen" class="screen hidden">
      <!-- Courts tab -->
      <section id="tab-courts" class="tab-panel">
        <div id="map"></div>
        <div class="map-topbar">
          <div class="search-wrap">
            <label class="sr-only" for="court-search">Search courts or cities</label>
            <input type="search" id="court-search" placeholder="Search courts or cities…" autocomplete="off"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggest" />
            <span id="search-spin" class="search-spin hidden"></span>
            <button id="search-clear" class="search-clear hidden" aria-label="Clear search">✕</button>
          </div>
          <button id="locate-btn" class="icon-btn" title="My location" aria-label="Center on my location"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" x2="5" y1="12" y2="12"/><line x1="19" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="5"/><line x1="12" x2="12" y1="19" y2="22"/><circle cx="12" cy="12" r="7"/></svg></button>
          <button id="bell-btn" class="icon-btn" title="Activity" aria-label="Activity and notifications" style="position:relative"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg><span id="bell-badge" class="badge hidden" style="top:4px;right:4px"></span></button>
        </div>
        <div id="search-suggest" class="search-suggest hidden" role="listbox" aria-label="Court search suggestions"></div>
        <div class="map-filters" id="map-filters" aria-label="Quick court filters">
          <button type="button" data-court-filter="saved" aria-pressed="false">⭐ Saved</button>
          <button type="button" data-court-filter="players" aria-pressed="false">🟢 Players here</button>
          <button type="button" data-court-filter="games" aria-pressed="false"><svg class="pb-ic"><use href="#pb"/></svg> Open games</button>
          <button type="button" id="court-more-filters" aria-expanded="false">⚙ Filters <span id="court-filter-count" class="filter-count hidden">0</span></button>
        </div>
        <button type="button" id="use-map-area" class="use-map-area hidden">Search this area</button>
        <div id="presence-banner" class="presence-banner hidden"></div>
        <button id="looking-banner" class="looking-banner hidden"></button>
        <div id="court-list" class="sheet court-sheet" data-snap="peek" aria-label="Court results">
          <div class="court-sheet-head" id="court-sheet-drag">
            <button type="button" class="sheet-handle" id="court-sheet-cycle" aria-label="Expand court results" aria-expanded="false"><span></span></button>
            <div class="court-sheet-view-row">
              <div class="segmented court-view-switch" id="court-view-switch" role="tablist" aria-label="Court view">
                <button type="button" role="tab" data-court-view="map" class="active" aria-selected="true">Map</button>
                <button type="button" role="tab" data-court-view="list" aria-selected="false">List <span id="court-result-count">0</span></button>
              </div>
              <button type="button" class="court-sheet-expand" id="court-sheet-expand" aria-label="Show full court list">⌃</button>
            </div>
            <div class="court-sheet-summary">
              <div class="row-main">
                <h3 class="sheet-title">Finding courts…</h3>
                <p id="court-list-context" class="row-sub">Move the map or search an area</p>
              </div>
              <label class="court-sort-label" for="court-sort">Sort</label>
              <select id="court-sort" aria-label="Sort courts">
                <option value="distance">Closest</option>
                <option value="active">Best now</option>
                <option value="rating">Top rated</option>
                <option value="courts">Most courts</option>
              </select>
            </div>
          </div>
          <div id="court-preview" class="court-preview hidden"></div>
          <div id="court-list-items" class="court-sheet-results"></div>
        </div>
      </section>

      <!-- Play tab -->
      <section id="tab-play" class="tab-panel hidden">
        <header class="tab-header play-header">
          <div class="tab-title-row">
            <div>
              <p id="play-context" class="tab-kicker">Your game plan</p>
              <h2 id="play-greeting">Ready to play?</h2>
            </div>
            <div class="tab-header-actions">
              <button id="play-activity" class="header-icon-btn" type="button" aria-label="Activity and notifications" style="position:relative">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/></svg>
                <span id="play-bell-badge" class="badge hidden"></span>
              </button>
              <button id="play-avatar-button" class="header-avatar-button" type="button" aria-label="Open my profile"></button>
            </div>
          </div>
          <div class="segmented" id="play-segments" role="tablist" aria-label="Play views">
            <button type="button" role="tab" id="play-tab-games" aria-controls="play-content" data-seg="games" class="active" aria-selected="true">Today</button>
            <button type="button" role="tab" id="play-tab-brackets" aria-controls="play-content" data-seg="brackets" aria-selected="false">Compete</button>
            <button type="button" role="tab" id="play-tab-scores" aria-controls="play-content" data-seg="scores" aria-selected="false">Rankings</button>
          </div>
        </header>
        <div id="play-content" class="tab-scroll" role="tabpanel" aria-labelledby="play-tab-games"></div>
        <button id="new-game-fab" class="fab" aria-label="Start a new game"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>
      </section>

      <!-- Chat tab -->
      <section id="tab-chat" class="tab-panel hidden">
        <header class="tab-header">
          <h2>Community</h2>
          <div class="segmented" id="chat-segments" role="tablist" aria-label="Community views">
            <button type="button" role="tab" id="chat-tab-chats" aria-controls="chat-content" data-seg="chats" class="active" aria-selected="true">Inbox <span id="chat-inbox-badge" class="segment-badge hidden"></span></button>
            <button type="button" role="tab" id="chat-tab-friends" aria-controls="chat-content" data-seg="friends" aria-selected="false">Friends <span id="chat-friends-badge" class="segment-badge hidden"></span></button>
            <button type="button" role="tab" id="chat-tab-nearby" aria-controls="chat-content" data-seg="nearby" aria-selected="false">Nearby</button>
          </div>
        </header>
        <div id="chat-content" class="tab-scroll" role="tabpanel" aria-labelledby="chat-tab-chats"></div>
      </section>

      <!-- Profile tab -->
      <section id="tab-profile" class="tab-panel hidden">
        <header class="tab-header"><h2>Me</h2></header>
        <div id="profile-content" class="tab-scroll"></div>
      </section>

      <!-- Active game banner (docked above the nav) -->
      <div id="active-game-banner" class="active-game-banner hidden"></div>

      <!-- Bottom navigation -->
      <nav id="bottom-nav" aria-label="Primary navigation">
        <button type="button" data-tab="play" class="nav-btn active" aria-current="page"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg></span>Play<span id="play-badge" class="badge hidden"></span></button>
        <button type="button" data-tab="courts" class="nav-btn"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg></span>Courts</button>
        <button type="button" data-tab="chat" class="nav-btn"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>Community<span id="chat-badge" class="badge hidden"></span></button>
        <button type="button" data-tab="profile" class="nav-btn"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>Me</button>
      </nav>
    </main>

    <!-- Overlays -->
    <div id="overlay-root"></div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script>
    // A previous cached app.js does not know about this launch shell. Observe
    // the two stable screen roots so either the old or new bundle dismisses it
    // the instant it reveals usable UI, while the shell remains visible during
    // download, parsing, and a slow signed-in resume.
    (() => {
      const boot = document.getElementById('boot-screen');
      const screens = [document.getElementById('auth-screen'), document.getElementById('main-screen')];
      const syncBoot = () => {
        if (screens.some((screen) => screen && !screen.classList.contains('hidden'))) {
          boot.classList.add('hidden');
          observer.disconnect();
        }
      };
      const observer = new MutationObserver(syncBoot);
      screens.forEach((screen) => observer.observe(screen, { attributes: true, attributeFilter: ['class'] }));
      syncBoot();
    })();
  </script>
  <script src="/crew-planner-v15.js"></script>
  <script src="/app-v15.js"></script>
</body>
</html>
